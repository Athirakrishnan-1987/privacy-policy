<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope=".7" intercept=".15"/>
      <feFuncG type="linear" slope=".7" intercept=".15"/>
      <feFuncB type="linear" slope=".7" intercept=".15"/>
      <feFuncA type="table" tableValues="0 .22"/>
    </feComponentTransfer>
  </filter>
  <rect width="128" height="128" filter="url(#grain)"/>
</svg>
